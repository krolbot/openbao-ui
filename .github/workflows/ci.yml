name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E (Playwright vs real OpenBao)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build and run the real single image (OpenBao + Next.js BFF) — the same
      # artifact shipped to users — and drive it with Playwright.
      - name: Build image
        run: docker build -t openbao-ui:ci .

      - name: Start container (dev mode)
        run: |
          docker run -d --name openbao-ui --init -p 3000:3000 \
            -e BAO_DEV=1 -e BAO_DEV_ROOT_TOKEN_ID=root openbao-ui:ci
          ok=""
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ui/login)" = "200" ]; then
              ok=1; echo "app ready after ${i}s"; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::app did not become ready"; docker logs openbao-ui; exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_TOKEN: root
        run: pnpm e2e

      - name: Container logs on failure
        if: failure()
        run: docker logs openbao-ui || true

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
