name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E (Playwright vs real OpenBao)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Assemble the standalone output + run it (with OpenBao) as the single
      # runtime image — same artifact behavior as the shipped image, but built
      # from the host-built app so CI never does an in-container install.
      - name: Build & start container
        run: |
          mkdir -p ci-ctx/app
          cp -r .next/standalone/. ci-ctx/app/
          mkdir -p ci-ctx/app/.next && cp -r .next/static ci-ctx/app/.next/static
          cp -r public ci-ctx/app/public
          cp docker/entrypoint.sh docker/openbao.hcl ci-ctx/
          docker build -f docker/Dockerfile.runtime \
            --build-arg OPENBAO_VERSION="$(tr -d '[:space:]' < .openbao-version)" \
            -t openbao-ui:ci ci-ctx
          docker run -d --name openbao-ui --init -p 3000:3000 \
            -e BAO_DEV=1 -e BAO_DEV_ROOT_TOKEN_ID=root openbao-ui:ci
          ok=""
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ui2/login)" = "200" ]; then
              ok=1; echo "app ready after ${i}s"; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then echo "::error::app not ready"; docker logs openbao-ui; exit 1; fi

      - run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_TOKEN: root
        run: pnpm e2e

      - name: Container logs on failure
        if: failure()
        run: docker logs openbao-ui || true

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
