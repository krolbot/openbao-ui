# Convenience wrapper around the single combined image (UI + OpenBao).
# Build once, run the whole stack: `docker compose up --build`.
services:
  openbao-ui:
    build:
      context: .
    image: openbao-ui:latest
    # PID 1 init so the two child processes (OpenBao + Next.js) are reaped cleanly.
    init: true
    ports:
      - "3000:3000"
    environment:
      # Dev mode: in-memory, auto-unsealed, fixed root token. Log in at
      # http://localhost:3000/ with the token below.
      BAO_DEV: "1"
      BAO_DEV_ROOT_TOKEN_ID: "root"
    # Dev mode keeps no state; no volumes needed. For non-dev runs, set
    # BAO_DEV=0 and mount a volume at /bao/file plus an init/unseal step.
