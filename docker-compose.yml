# Production-safe wrapper around the single combined image (UI + OpenBao).
# Initialize and unseal OpenBao before serving production traffic.
services:
  openbao-ui:
    build:
      context: .
    image: openbao-ui:latest
    # PID 1 init so the two child processes (OpenBao + Next.js) are reaped cleanly.
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BAO_DEV: "0"
      OPENBAO_UI_PUBLIC_URL: ${OPENBAO_UI_PUBLIC_URL:?set the public HTTPS origin in .env}
    volumes:
      - ./data/openbao:/bao/file
